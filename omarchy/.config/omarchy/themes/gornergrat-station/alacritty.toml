# ────────────────────────────────────────────────────────────
# Gornergrat Station Theme for Alacritty
# Gornergrat Station inspired light color scheme
# ────────────────────────────────────────────────────────────

[window]
padding.x = 14
padding.y = 14
opacity = 0.98

[font]
size = 12.0

[colors.primary]
foreground = "#0B1626"
background = "#CAD0D8"
dim_foreground = "#19293F"
bright_foreground = "#0B1626"

[colors.cursor]
text = "#CAD0D8"
cursor = "#274369"

[colors.vi_mode_cursor]
text = "#CAD0D8"
cursor = "#21477A"

[colors.search.matches]
foreground = "#CAD0D8"
background = "#536A89"

[colors.search.focused_match]
foreground = "#CAD0D8"
background = "#21477A"

[colors.hints.start]
foreground = "#0B1626"
background = "#D6DCE4"

[colors.hints.end]
foreground = "#19293F"
background = "#D6DCE4"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#0B1626"
background = "#C0C6CE"

[colors.selection]
text = "#0B1626"
background = "#A8B2C0"

[colors.normal]
black = "#C0C6CE"
red = "#8B5A5A"
green = "#2A5F5F"
yellow = "#8B7355"
blue = "#21477A"
magenta = "#536A89"
cyan = "#274369"
white = "#0B1626"

[colors.bright]
black = "#A8B2C0"
red = "#9B6A6A"
green = "#3A6F6F"
yellow = "#9B8365"
blue = "#0E2E61"
magenta = "#274369"
cyan = "#19293F"
white = "#0B1626"

[colors.dim]
black = "#B8C2D0"
red = "#7B4A4A"
green = "#1A4F4F"
yellow = "#7B6345"
blue = "#315787"
magenta = "#637A99"
cyan = "#375379"
white = "#19293F"