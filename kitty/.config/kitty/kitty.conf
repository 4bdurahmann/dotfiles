include ~/.config/omarchy/current/theme/kitty.conf

# Font
# font_family      JetBrainsMono Nerd Font SemiBold
# bold_font        JetBrainsMono Nerd Font ExtraBold
# italic_font      JetBrainsMono Nerd Font SemiBold Italic
# bold_italic_font JetBrainsMono Nerd Font ExtraBold Italic

font_family      JetBrainsMonoNF
old_font        JetBrainsMonoNF
italic_font      JetBrainsMonoNF-Italic
bold_italic_font JetBrainsMonoNF-BoldItalic

text_gamma_adjustment 2.0
text_contrast 30
symbol_map U+0600-U+06FF Noto Sans Arabic UI
force_ltr no
font_size 10.0
disable_ligatures never

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
resize_draw_strategy scale

# Performance
sync_to_monitor yes
repaint_delay 10
input_delay 0

# Clipboard map ctrl+insert copy_to_clipboard map shift+insert paste_from_clipboard
# Remote access
allow_remote_control yes

# Cursor
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# Neovide-like cursor trail
cursor_trail 10
cursor_trail_decay 0.01 0.5
cursor_trail_start_threshold 1

# Scrolling
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 2.0
scrollback_lines 10000

# Bell
enable_audio_bell no
visual_bell_duration 0

# Selection
copy_on_select yes
strip_trailing_spaces smart

# URL handling
detect_urls yes

# Tab Bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
tab_separator " "

# Rendering
text_composition_strategy 1.0 0

# --- Tabs ---
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+w     close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+1     goto_tab 1
map ctrl+shift+2     goto_tab 2
map ctrl+shift+3     goto_tab 3

# --- Windows (splits) ---
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window
map ctrl+shift+f5    start_resizing_window

# --- Resize ---
map alt+left            resize_window narrower 3
map alt+right           resize_window wider 3
map alt+up              resize_window taller 3
map alt+down            resize_window shorter 3
map ctrl+shift+r        start_resizing_window   # interactive resize mode

# Reset layout
map ctrl+shift+backspace resize_window reset
# --- Scrollback ---
map ctrl+shift+k     scroll_line_up
map ctrl+shift+j     scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home  scroll_home
map ctrl+shift+end   scroll_end

# --- Font size ---
map ctrl+equal       change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0

# --- Copy/Paste ---
map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard

# --- Misc ---
map ctrl+shift+f     show_scrollback   # open scrollback in pager
map ctrl+shift+u     kitten unicode_input
map ctrl+shift+escape kitty_shell window  # debug shell
